<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0a3a2b">
  <meta name="description" content="YVO Épargne — collecte quotidienne, clients, pointage, trésorerie et reçus. Fonctionne 100 % hors ligne.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YVO Épargne">
  <title>YVO Épargne — Collecte & épargne hors ligne</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="premium.css">
</head>
<body>
  <div id="welcome" class="welcome" hidden></div>
  <div id="lock-screen" class="lock-screen" hidden></div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <a class="brand" href="#/tableau" aria-label="YVO Épargne, tableau de bord">
        <span class="brand-mark">Y</span>
        <span class="brand-text"><strong>YVO Épargne</strong><small>Collecte &amp; épargne</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot">
        <button type="button" class="lock-link" data-action="lock-now">
          <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Verrouiller
        </button>
        <div class="side-version" id="side-version"></div>
      </div>
    </aside>

    <div class="main">
      <header class="mobile-bar" id="mobile-bar">
        <a class="icon-btn mb-back" id="mb-back" href="#/clients" hidden aria-label="Retour"></a>
        <span class="brand-mark mb-brand" id="mb-brand">Y</span>
        <div class="mb-title"><strong id="mb-title">YVO Épargne</strong><small id="mb-sub"></small></div>
        <div class="mobile-actions" id="mb-actions"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigation mobile"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script src="js/core.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views-dashboard.js"></script>
  <script src="js/views-pointage.js"></script>
  <script src="js/views-clients.js"></script>
  <script src="js/views-cash.js"></script>
  <script src="js/views-more.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/modals-pay.js"></script>
  <script src="js/receipt-code.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/recus.js"></script>
  <script src="js/avances.js"></script>
  <script src="js/alertes.js"></script>
  <script src="js/views-commission.js"></script>
  <script src="js/views-sync.js"></script>
  <script src="js/card-types.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/handlers-extra.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
