# Déploiement Render.com (blueprint). Un disque persistant est indispensable :
# c'est là que vit la base SQLite et ses sauvegardes quotidiennes.
services:
  - type: web
    name: yvo-epargne
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: yvo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SETUP_CODE        # à définir dans le tableau de bord Render
        sync: false
      - key: REGISTRATION
        value: closed          # une fois l'espace d'Yvo créé, plus personne ne peut en créer
