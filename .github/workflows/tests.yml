name: Tests de non-régression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntaxe:
    name: Syntaxe JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-syntax.js

  e2e:
    name: Application (mobile + ordinateur)
    needs: syntaxe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yvo
          POSTGRES_PASSWORD: yvo
          POSTGRES_DB: yvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yvo -d yvo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lancer les tests
        run: npx playwright test
        env:
          CI: true
          TEST_DATABASE_URL: postgres://yvo:yvo@localhost:5432/yvo_test
          YVO_PASSWORD: ${{ secrets.YVO_PASSWORD }}
      - name: Rapport des tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 14

  docker:
    name: Image Docker
    needs: syntaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichier .env factice
        run: |
          echo "YVO_PASSWORD=ci-factice-2026" > .env
          echo "POSTGRES_PASSWORD=ci-factice-db" >> .env
      - name: docker compose démarre et répond
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://localhost:8080/api/health && exit 0; sleep 2; done
          docker compose logs; exit 1
      - name: Arrêt
        if: ${{ always() }}
        run: docker compose down -v
